<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" aria-labelledby="dg3-title dg3-desc" class="ce-dg">
  <title id="dg3-title">Muslims who say violence against civilians in defence of Islam is never justified</title>
  <desc id="dg3-desc">Pew Research Center, 2013. Pakistan 89 percent; Indonesia 81 percent; Nigeria 78 percent; Malaysia 58 percent.</desc>
  <g class="dg-grid">
    <line x1="150" y1="20" x2="150" y2="262"/><line x1="265" y1="20" x2="265" y2="262"/><line x1="380" y1="20" x2="380" y2="262"/><line x1="495" y1="20" x2="495" y2="262"/><line x1="610" y1="20" x2="610" y2="262"/>
  </g>
  <text x="150" y="290" text-anchor="middle" class="dg-ref">0%</text><text x="265" y="290" text-anchor="middle" class="dg-ref">25%</text><text x="380" y="290" text-anchor="middle" class="dg-ref">50%</text><text x="495" y="290" text-anchor="middle" class="dg-ref">75%</text><text x="610" y="290" text-anchor="middle" class="dg-ref">100%</text>
  <text x="136" y="62" text-anchor="end" class="dg-text">Pakistan</text>
  <rect x="150" y="36" width="409.4" height="40" rx="6" class="dg-bar"/><text x="549" y="63" text-anchor="end" class="dg-barlabel">89%</text>
  <text x="136" y="122" text-anchor="end" class="dg-text">Indonesia</text>
  <rect x="150" y="96" width="372.6" height="40" rx="6" class="dg-bar"/><text x="512" y="123" text-anchor="end" class="dg-barlabel">81%</text>
  <text x="136" y="182" text-anchor="end" class="dg-text">Nigeria</text>
  <rect x="150" y="156" width="358.8" height="40" rx="6" class="dg-bar"/><text x="499" y="183" text-anchor="end" class="dg-barlabel">78%</text>
  <text x="136" y="242" text-anchor="end" class="dg-text">Malaysia</text>
  <rect x="150" y="216" width="266.8" height="40" rx="6" class="dg-bar dg-bar--muted"/><text x="407" y="243" text-anchor="end" class="dg-barlabel">58%</text>
  <text x="380" y="322" text-anchor="middle" class="dg-label">SAY "NEVER JUSTIFIED"</text>
</svg>
